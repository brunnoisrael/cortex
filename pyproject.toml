[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-knowledge"
version = "0.1.0"
description = "Cortex — local-first engineering knowledge compiler for AI coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "mcp>=1.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "pip-audit",
]

[project.scripts]
cortex = "cortex.cli.app:main"

[tool.setuptools.packages.find]
include = ["cortex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["cortex"]

[tool.coverage.report]
# Baseline measured week 1 of the hardening plan (item 4.2); raise by ~5pp
# per wave of tests added rather than jumping straight to a strict target.
fail_under = 55
show_missing = true

[tool.mypy]
python_version = "3.11"
# Start narrow and strict rather than repo-wide and lenient: these are the
# modules whose implicit contracts are most expensive to get wrong
# (_row_to_entity's shape, config coercion, ranking weights) — see item 4.4.
files = ["cortex/storage", "cortex/knowledge", "cortex/config.py", "cortex/compiler"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
# cortex/compiler imports cortex/distillation/extractors, which (via
# distillation/__init__.py re-exporting DistillationEngine) pulls in the
# rest of distillation/. follow_imports=silent keeps using those modules'
# inferred types without reporting *their* errors — distillation/ isn't in
# scope for this wave, so a partially-annotated engine.py shouldn't fail a
# CI job whose target is storage/knowledge/config/compiler.
follow_imports = "silent"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Mechanical/safe categories enforced in CI. BLE001 (blind except) and B008
# (call in default arg) are deliberately NOT enabled: PRD §42 requires broad
# except-and-degrade at capture/distill/compile boundaries (never block the
# coding agent), and the CLI's typer.Option(...) defaults are the idiomatic
# pattern for that framework — both would just generate noise to silence.
select = ["E4", "E7", "E9", "F", "I", "UP"]
# UP042 (str+Enum -> StrEnum) is deferred on purpose: these Enums round-trip
# through Pydantic models and JSON persistence (`.value` used pervasively);
# StrEnum's str()/repr() differ subtly from the (str, Enum) mixin, and that
# needs its own test pass, not a drive-by lint fix. Tracked in
# AUDITORIA_EXTERNA_2026-09-07.md.
ignore = ["UP042"]
