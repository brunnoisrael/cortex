name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Cortex
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: mypy (core modules)
        run: mypy

      - name: Run tests with coverage
        run: python -m pytest tests/ -v --cov=cortex --cov-report=term-missing

      - name: pip-audit
        run: pip-audit . --skip-editable

  enhanced:
    name: Enhanced contracts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Cortex with enhanced integrations
        run: pip install -e ".[dev,enhanced]"

      - name: Run enhanced contract tests
        run: python -m pytest tests/ -q

      # NOTE: `cortex benchmark --dogfood` is intentionally not wired into CI
      # yet — dogfooding against this repo itself is a small, self-referential
      # sample. Add it in a scheduled job once it runs against a real external
      # repository, not on every PR, so a bad benchmark day does not block
      # unrelated changes.

  # Onda 5: benchmark regression on every PR.  It must stay well under 2 min,
  # so it runs the frozen nofiller corpus only — no filler32k, no ablations.
  benchmark-regression:
    name: Benchmark regression (nofiller)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Cortex
        run: pip install -e ".[dev]"

      - name: Benchmark tests
        run: python -m pytest tests/benchmarks -q

      - name: Legacy benchmark still works (G1)
        run: python -m cortex.benchmarks.runner --manifest cortex/benchmarks/corpora/manifests/mvp.json --adapter cortex bm25 oracle --report-out artifacts/benchmark-mvp

      - name: Frozen corpus regression (G0/G1)
        run: python -m cortex.benchmarks.runner --manifest cortex/benchmarks/corpora/manifests/memory_v1.json --adapter cortex bm25 bm25_temporal raw_context no_memory oracle --report-out artifacts/benchmark-regression

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-regression
          path: artifacts/benchmark-regression
          retention-days: 14
